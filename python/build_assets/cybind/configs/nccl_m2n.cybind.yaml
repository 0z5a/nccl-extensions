nccl_m2n:
  module: nccl._extensions.bindings.nccl_m2n
  data:
    versions:
    - - 0.2.0
    headers:
    - nccl_m2n.h
    patterns:
      function: (^nccl)(M2n.*|Reshard.*)
      type: (^ncclM2n)([A-Z].*)_t$|(^nccl)(Mesh|DistTensor)_t$
    need_cuda: true
    need_driver: false
    support_win: false
    docstrings: null
    # The generated declarations encode this public ABI. Wheel builds must not
    # need a separately installed M2N development header.
    need_headers_at_build: false
    include_cybind_version: false
    status_enum: ncclResult_t
    extern:
      cython:
        - module: nccl.bindings.cynccl
          import_type: cimport
          imports:
            - ncclResult_t
            - ncclDataType_t
            - ncclComm_t
            - ncclWindow_t
            - _NCCLRESULT_T_INTERNAL_LOADING_ERROR
  functions:
    ncclM2nInit:
      return: handle
      except?: 0
    ncclM2nFinalize: {}
    ncclReshardWithWindow: {}
    ncclReshard: {}
    # Returns const char*, so cybind gives it an `except?NULL` contract while
    # the internal thunk stays no-throw and reports NULL instead.
    ncclM2nGetLastError: {}
    # Group symbols are resolved at init but not required, so a library without
    # them fails only when a group call is made.
    ncclM2nGroupStart: {}
    ncclM2nGroupEnd: {}
    ncclM2nGroupAbort: {}
  types:
    ncclM2nConfig_t:
      AUTO_LOWPP_CLASS:
        __config__:
          __init__:
            post_alloc: |-
              self._ptr[0].size = sizeof(ncclM2nConfig_t)
              self._ptr[0].magic = NCCL_M2N_API_MAGIC
              self._ptr[0].version = NCCL_M2N_API_VERSION
              self._ptr[0].maxCta = NCCL_M2N_CONFIG_UNDEF_INT
      member_aliases:
        maxCta: maxCta
    ncclMesh_t:
      AUTO_LOWPP_CLASS:
        __config__:
          __init__:
            post_alloc: |-
              self._ptr[0].size = sizeof(ncclMesh_t)
              self._ptr[0].version = NCCL_M2N_API_VERSION
        dims:
          size: ndims
      member_aliases:
        startRank: startRank
    ncclDistTensor_t:
      AUTO_LOWPP_CLASS:
        __config__:
          __init__:
            post_alloc: |-
              self._ptr[0].size = sizeof(ncclDistTensor_t)
              self._ptr[0].version = NCCL_M2N_API_VERSION
        localShape:
          size: ndims
        mesh:
          getter: |-
            return <intptr_t>(self._ptr[0].mesh)
          setter: |-
            self._ptr[0].mesh = <const ncclMesh_t*><intptr_t>val
        placements:
          getter: |-
            cdef int mesh_ndims
            if self._ptr[0].placements == NULL or self._ptr[0].mesh == NULL:
              return ()
            mesh_ndims = self._ptr[0].mesh.ndims
            if mesh_ndims < 1 or mesh_ndims > NCCL_RESHARD_MAX_MESH_DIMS:
              raise ValueError(
                f"mesh.ndims must be in [1, {NCCL_RESHARD_MAX_MESH_DIMS}], got {mesh_ndims}"
              )
            return tuple(self._ptr[0].placements[d] for d in range(mesh_ndims))
          setter: |-
            if len(val) < 1 or len(val) > NCCL_RESHARD_MAX_MESH_DIMS:
              raise ValueError(f"placements must have length 1..{NCCL_RESHARD_MAX_MESH_DIMS}")
            placements = _numpy.ascontiguousarray(val, dtype=_numpy.int32)
            self._refs["placements"] = placements
            self._ptr[0].placements = <int*><intptr_t>placements.ctypes.data
      member_aliases:
        dataPtr: dataPtr
        localShape: localShape
        dtype: dtype
  attrs: {}
  enums:
    ^nccl: ''
    ^NCCL_RESHARD_: ''
    ^NCCL_M2N_: ''
