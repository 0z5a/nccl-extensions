<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1570" viewBox="0 0 1240 1570" role="img" aria-labelledby="title description">
<title id="title">Decoding CP with group_cast and group_reduce</title>
<desc id="description">Two DCP ranks process the same batch of four decode queries. Each request has 8192 KV positions, 4096 per rank. KV stays local and its positions may be interleaved. This NCCL CP example uses tensors produced directly in [heads,batch,D] layout. Rank 0 initially owns Q heads 0 through 3 and rank 1 owns heads 4 through 7. Both Q tensors have shape [4,4,D]. AllGather along axis 0 produces the same Q [8,4,D] on both ranks. Each rank attends to its local KV shard, producing partial output [8,4,D] and LSE [8,4]. LSE-weighted reduction across KV shards returns output heads 0 through 3 to rank 0 and heads 4 through 7 to rank 1, both [4,4,D]. Each communication row is one head, with payload [batch,D]. Rank 0 handle owns RowRange(0,4); rank 1 owns RowRange(4,8); both request RowRange(0,8). No reshape or transpose is needed. group_cast expresses the Q AllGather and the proposed group_reduce(reduce_type="lse") expresses the output merge and scatter separately for each query and head. This is a forward-only inference schematic; LSE reduction is not implemented in the current NCCL CP API.</desc>
